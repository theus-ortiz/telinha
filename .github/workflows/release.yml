name: release

# Roda quando uma tag tipo v1.2.3 é enviada: gera o instalador e publica no Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar Wails e NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          choco install nsis -y --no-progress
          # o choco não coloca o makensis no PATH; sem ele o Wails pula o instalador sem dar erro
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Conferir NSIS
        run: makensis /VERSION

      - name: Versão a partir da tag
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}".TrimStart('v')
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $cfg.info.productVersion = $versao
          $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Build
        run: wails build -platform windows/amd64 -nsis -clean

      - name: Conferir instalador
        shell: pwsh
        run: |
          Get-ChildItem build/bin
          if (-not (Test-Path build/bin/telinha-amd64-installer.exe)) { throw "instalador não foi gerado" }

      # Quando o SignPath aprovar o projeto, a etapa de assinatura entra aqui.

      - name: Publicar
        uses: softprops/action-gh-release@v3
        with:
          files: build/bin/telinha-amd64-installer.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
